services:
  # API service
  - type: web
    name: ai-trading-bot-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python install_mock_modules.py
      python check_requirements.py
      python render_fix.py
    startCommand: gunicorn wsgi:app --log-file=-
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SERVE_FRONTEND
        value: true
      - key: MOCK_DEPENDENCIES
        value: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: RENDER_DEPLOYMENT
        value: true
    healthCheckPath: /health
    # Automatic deploy from GitHub
    autoDeploy: true
    disk:
      name: ai-trading-bot-data
      mountPath: /data
      sizeGB: 1

services:
  - type: web
    name: ai-trading-bot-api
    env: python
    buildCommand: >
      pip install -r requirements.txt &&
      cd frontend &&
      npm install &&
      npm run build &&
      cd .. &&
      python render_fix.py &&
      ls -la frontend/build/static/*
    startCommand: >
      gunicorn wsgi:app --workers=2 --threads=4 --timeout=120 --bind=0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: USE_MOCK_BROKER
        value: true
      - key: USE_MOCK_POLYGON
        value: true
      - key: USE_MOCK_ALPACA
        value: true
      - key: SERVE_FRONTEND
        value: true
      - key: LOG_LEVEL
        value: DEBUG
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: ai-trading-bot-data
      mountPath: /data
      sizeGB: 1

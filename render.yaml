services:
  - type: web
    name: ai-trading-bot
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python copy_config_files.py
      mkdir -p static/css static/js static/images data/logs data/broker data/market_data
      cd frontend && npm install && npm run build && cd ..
      cp -r frontend/build/* static/
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NODE_VERSION
        value: 18  # Updated from EOL v16
      - key: APP_ENV
        value: production
    healthCheckPath: /health
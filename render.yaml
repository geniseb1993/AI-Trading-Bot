services:
  # Web Service
  - type: web
    name: ai-trading-bot-api
    env: python
    buildCommand: >
      pip install -r requirements.txt &&
      mkdir -p frontend/build/static/css frontend/build/static/js frontend/build/static/images &&
      mkdir -p static/css static/js static/images &&
      python setup_static_files.py &&
      python copy_to_frontend_build.py &&
      ls -la frontend/build/static/*
    startCommand: >
      python ensure_directories.py &&
      python setup_static_files.py &&
      python copy_to_frontend_build.py &&
      ls -la frontend/build/static/* &&
      gunicorn wsgi:app --workers=4 --threads=2 --timeout=120 --bind=0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: USE_MOCK_BROKER
        value: true
      # Add environment variables to enable fallbacks
      - key: USE_MOCK_POLYGON
        value: true
      - key: USE_MOCK_ALPACA
        value: true
      - key: SERVE_FRONTEND
        value: true
      - key: PATH_DEBUG
        value: true
      # Add your environment variables from the dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: ALPACA_API_KEY  
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    autoDeploy: true
    disk:
      name: ai-trading-bot-data
      mountPath: /data
      sizeGB: 1 
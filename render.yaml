services:
  # Web Service
  - type: web
    name: ai-trading-bot-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ensure_directories.py && gunicorn wsgi:app --workers=4 --threads=2 --timeout=120 --bind=0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      # Add your environment variables from the dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: ALPACA_API_KEY  
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    autoDeploy: true
    disk:
      name: ai-trading-bot-data
      mountPath: /data
      sizeGB: 1 
services:
  # Web service
  - type: web
    name: ai-trading-bot
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      python -m venv .venv
      . .venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install gunicorn
      python copy_config_files.py
      mkdir -p static/css static/js static/images
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: APP_ENV
        value: production
      - key: RENDER_DEPLOYMENT
        value: true
      - key: USE_MOCK_BROKER
        value: true
      - key: USE_MOCK_DATA
        value: true
      - key: STATIC_FOLDER
        value: static
      - key: FLASK_STATIC_URL_PATH
        value: ""
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ai-trading-bot-data
      mountPath: /data
      sizeGB: 1

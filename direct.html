<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vicki AI Trading Bot</title>
    <style>
        /* Base styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        
        /* Layout */
        .app {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: #111;
            padding: 20px;
            border-right: 2px solid #ff00ff;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        
        .logo-text {
            color: #ff00ff;
            margin-top: 10px;
        }
        
        /* Menu items */
        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            color: #aaa;
        }
        
        .menu-item.active {
            background-color: #1e1e2f;
            border-left: 4px solid #ff00ff;
            color: white;
        }
        
        .menu-icon {
            margin-right: 10px;
        }
        
        /* Main content */
        .main-content {
            flex: 1;
            padding: 20px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header-buttons {
            display: flex;
            align-items: center;
        }
        
        .bell-icon {
            margin-right: 15px;
            font-size: 20px;
            cursor: pointer;
        }
        
        .vault-button {
            background-color: #1c1c2e;
            color: #ff00ff;
            border: 2px solid #ff00ff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* Cards */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .card {
            background-color: #1c1c2e;
            border-radius: 10px;
            padding: 20px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .card-title {
            margin: 0;
            color: #ddd;
        }
        
        .card-button {
            background-color: #1c1c2e;
            color: #aaa;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* Card sizes */
        .card-large {
            flex-basis: calc(60% - 20px);
        }
        
        .card-medium {
            flex-basis: calc(40% - 20px);
        }
        
        /* Version indicator */
        .version {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #666;
        }
        
        /* Portfolio values */
        .portfolio-value {
            font-size: 3rem;
            margin: 20px 0;
            color: #fff;
        }
        
        .portfolio-change {
            color: #4caf50;
            margin-bottom: 10px;
        }
        
        .portfolio-change-period {
            margin-left: 10px;
            color: #aaa;
        }
        
        /* Button styles */
        .primary-button {
            width: 100%;
            background-color: #ff00ff;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Status indicators */
        .status-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .status-name {
            display: flex;
            align-items: center;
        }
        
        .status-dot {
            margin-right: 10px;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: #4caf50;
        }
        
        .status-badge {
            background-color: #4caf50;
            color: black;
            padding: 5px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-container">
                <img src="/static/images/logo.png" alt="Vicki Logo" class="logo" 
                     onerror="this.onerror=null; this.src='/static/images/vicky.png'; if (this.src.includes('static/images/vicky.png')) this.onerror=function(){this.style.display='none'; this.parentNode.innerHTML += '<div style=\"width: 80px; height: 80px; border-radius: 50%; background-color: #ff00ff; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;\">V</div>';}">
                <h2 class="logo-text">VICKY</h2>
            </div>
            
            <div class="menu">
                <div class="menu-item active">
                    <span class="menu-icon">📊</span>
                    <span>Dashboard</span>
                </div>
                <div class="menu-item">
                    <span class="menu-icon">📈</span>
                    <span>Live Market</span>
                </div>
                <div class="menu-item">
                    <span class="menu-icon">🔍</span>
                    <span>Signals</span>
                </div>
                <div class="menu-item">
                    <span class="menu-icon">⏱️</span>
                    <span>Backtest</span>
                </div>
                <div class="menu-item">
                    <span class="menu-icon">📊</span>
                    <span>Market Data</span>
                </div>
            </div>
            
            <div class="version">v2.0 · Vicky</div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div></div>
                <div class="header-buttons">
                    <div class="bell-icon">🔔</div>
                    <button class="vault-button">CLOSE VAULT</button>
                </div>
            </div>
            
            <!-- Cards -->
            <div class="cards-container">
                <!-- Portfolio Overview -->
                <div class="card card-large">
                    <div class="card-header">
                        <h2 class="card-title">Portfolio Overview</h2>
                        <button class="card-button">Mock Data</button>
                    </div>
                    
                    <div class="portfolio-value">$25,430.87</div>
                    <div class="portfolio-change">
                        <span style="font-size: 1.2rem;">+345.21 (+1.37%)</span>
                        <span class="portfolio-change-period">Today</span>
                    </div>
                    <div class="portfolio-change">
                        <span style="font-size: 1.2rem;">+0.00 (+0%)</span>
                        <span class="portfolio-change-period">This Week</span>
                    </div>
                </div>
                
                <!-- Bot Status -->
                <div class="card card-medium">
                    <div class="card-header">
                        <h2 class="card-title">Trading Bot Status</h2>
                        <button class="card-button">Mock Data</button>
                    </div>
                    
                    <h3 style="color: #ddd; margin-bottom: 15px;">Trading Bots</h3>
                    
                    <div class="status-indicator">
                        <div class="status-name">
                            <div class="status-dot"></div>
                            <div>AI Trading Bot</div>
                        </div>
                        <div class="status-badge">Active</div>
                    </div>
                    
                    <button class="primary-button">TEST TRADING ALERT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple interactions for the UI
        document.addEventListener('DOMContentLoaded', function() {
            // Menu item click
            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', function() {
                    menuItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            
            // Bell icon click
            const bellIcon = document.querySelector('.bell-icon');
            if (bellIcon) {
                bellIcon.addEventListener('click', function() {
                    alert('Notifications feature coming soon!');
                });
            }
            
            // Vault button click
            const vaultButton = document.querySelector('.vault-button');
            if (vaultButton) {
                vaultButton.addEventListener('click', function() {
                    alert('Vault feature coming soon!');
                });
            }
            
            // Test trading alert button
            const alertButton = document.querySelector('.primary-button');
            if (alertButton) {
                alertButton.addEventListener('click', function() {
                    fetch('/api/health')
                        .then(response => response.json())
                        .then(data => {
                            alert('API Status: ' + data.status);
                        })
                        .catch(error => {
                            alert('Error connecting to API: ' + error.message);
                        });
                });
            }
        });
    </script>
</body>
</html>

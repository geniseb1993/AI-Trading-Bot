    <!--

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Add Share Tech Mono font for cyberpunk UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <title>Vicky</title>
    <style>
      /* Apply some basic styling to ensure the app looks good */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #121212;
        color: white;
      }
      
      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }
      
      /* Add a cool scanline effect */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          transparent 0px,
          rgba(0, 0, 0, 0.05) 1px,
          transparent 2px
        );
        pointer-events: none;
        z-index: 9999;
        opacity: 0.2;
      }
    </style>
    
    <!-- Port 5000 interceptor script -->
    <script>
      // Intercept and fix any network requests to port 5000
      (function() {
        // Save original fetch
        const originalFetch = window.fetch;
        
        // Override fetch to intercept port 5000 requests
        window.fetch = function(resource, options) {
          // Check if resource is a string (URL) and contains port 5000
          if (typeof resource === 'string' && 
              (resource.includes(':5000/') || resource.includes('localhost:5000'))) {
            console.log('Intercepted fetch to port 5000, redirecting to port 5001:', resource);
            
            // Replace port 5000 with port 5001
            const modifiedResource = resource.replace(/:5000\//g, ':5001/').replace(/localhost:5000/g, 'localhost:5001');
            console.log('Redirected to:', modifiedResource);
            
            // Call original fetch with modified URL
            return originalFetch(modifiedResource, options);
          }
          
          // Original behavior for other requests
          return originalFetch(resource, options);
        };
        
        // Also intercept XMLHttpRequest
        const originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
          // Check if URL contains port 5000
          if (typeof url === 'string' && 
              (url.includes(':5000/') || url.includes('localhost:5000'))) {
            console.log('Intercepted XHR to port 5000, redirecting to port 5001:', url);
            
            // Replace port 5000 with port 5001
            const modifiedUrl = url.replace(/:5000\//g, ':5001/').replace(/localhost:5000/g, 'localhost:5001');
            console.log('Redirected to:', modifiedUrl);
            
            // Call original open with modified URL
            return originalXHROpen.call(this, method, modifiedUrl, async, user, password);
          }
          
          // Original behavior for other requests
          return originalXHROpen.call(this, method, url, async, user, password);
        };
        
        console.log('Port 5000 request interceptor initialized');
      })();
    </script>
  </head>

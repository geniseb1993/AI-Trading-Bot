<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #121212;
            color: #eee;
        }
        h1, h2 {
            color: #4caf50;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
        pre {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            color: #e6e6e6;
        }
        .signal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .signal-card {
            background-color: #1e1e1e;
            border-radius: 5px;
            padding: 15px;
            border-left: 4px solid #4caf50;
        }
        .signal-card.short {
            border-left: 4px solid #f44336;
        }
        .symbol {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .score {
            font-weight: bold;
        }
        .buy .score {
            color: #4caf50;
        }
        .short .score {
            color: #f44336;
        }
        .details {
            margin-top: 10px;
            font-size: 0.9em;
            color: #bbb;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
        }
        .error {
            background-color: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
        }
    </style>
</head>
<body>
    <h1>Trading Signals API Debug Test</h1>
    
    <div style="margin-bottom: 20px;">
        <a href="/#/signals" target="_blank" style="color: #4caf50; text-decoration: none; padding: 10px; border: 1px solid #4caf50; border-radius: 4px; margin-right: 10px;">Open Signals Page</a>
        <a href="/test-signals-api.html" target="_blank" style="color: #4caf50; text-decoration: none; padding: 10px; border: 1px solid #4caf50; border-radius: 4px;">Open API Test Page</a>
    </div>
    
    <div id="api-tests">
        <h2>API Tests</h2>
        <button id="testApiBtn">Test API Connection</button>
        <button id="fetchSignalsBtn">Fetch Signals</button>
        <button id="fetchMockBtn">Fetch Mock Signals</button>
        <button id="testTvIntegrationBtn">Test TV Integration</button>
        <button id="clearBtn">Clear Results</button>
        
        <div id="status" class="status"></div>
        
        <pre id="rawResponse">No results yet.</pre>
    </div>

    <div id="signal-display" style="display: none;">
        <h2>Buy Signals</h2>
        <div id="buySignals" class="signal-grid"></div>
        
        <h2>Short Signals</h2>
        <div id="shortSignals" class="signal-grid"></div>
    </div>

    <script>
        // API Endpoints
        const API_URL = 'http://localhost:5000/api';
        
        // DOM Elements
        const statusEl = document.getElementById('status');
        const rawResponseEl = document.getElementById('rawResponse');
        const buySignalsEl = document.getElementById('buySignals');
        const shortSignalsEl = document.getElementById('shortSignals');
        const signalDisplayEl = document.getElementById('signal-display');
        
        // Event Listeners
        document.getElementById('testApiBtn').addEventListener('click', testApiConnection);
        document.getElementById('fetchSignalsBtn').addEventListener('click', fetchSignals);
        document.getElementById('fetchMockBtn').addEventListener('click', fetchMockSignals);
        document.getElementById('testTvIntegrationBtn').addEventListener('click', testTvIntegration);
        document.getElementById('clearBtn').addEventListener('click', clearResults);
        
        // Test API Connection
        async function testApiConnection() {
            updateStatus('Testing API connection...', '');
            
            try {
                const response = await fetch(`${API_URL}/test`);
                const data = await response.json();
                
                displayRawResponse(data);
                
                if (data.success) {
                    updateStatus(`API connection successful: ${data.message}`, 'success');
                } else {
                    updateStatus(`API connection failed: ${data.message || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error testing API:', error);
                updateStatus(`Error testing API: ${error.message}`, 'error');
            }
        }
        
        // Fetch Signals
        async function fetchSignals() {
            updateStatus('Fetching signals from API...', '');
            
            try {
                const response = await fetch(`${API_URL}/get-saved-signals`);
                const data = await response.json();
                
                displayRawResponse(data);
                
                if (data.success) {
                    updateStatus('Successfully fetched signals from API', 'success');
                    
                    if (data.buy_signals && data.short_signals) {
                        displaySignals(data.buy_signals, data.short_signals);
                    } else {
                        updateStatus('API response is missing signal data', 'error');
                    }
                } else {
                    updateStatus(`Failed to fetch signals: ${data.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                console.error('Error fetching signals:', error);
                updateStatus(`Error fetching signals: ${error.message}`, 'error');
            }
        }
        
        // Fetch Mock Signals
        function fetchMockSignals() {
            updateStatus('Generating mock signals...', '');
            
            const mockData = {
                success: true,
                buy_signals: [
                    { date: '2025-04-16', symbol: 'SPY', signal_score: 8.19, close: 525.66, ema_9: 525.66, ema_21: 525.66, volume: 83249030 },
                    { date: '2025-04-16', symbol: 'AAPL', signal_score: 7.90, close: 194.27, ema_9: 194.27, ema_21: 194.27, volume: 59669999 },
                    { date: '2025-04-16', symbol: 'MSFT', signal_score: 8.99, close: 371.61, ema_9: 371.61, ema_21: 371.61, volume: 21946406 },
                    { date: '2025-04-16', symbol: 'TSLA', signal_score: 8.74, close: 241.55, ema_9: 241.55, ema_21: 241.55, volume: 112255697 },
                    { date: '2025-04-16', symbol: 'NVDA', signal_score: 9.33, close: 104.49, ema_9: 104.49, ema_21: 104.49, volume: 396238244 }
                ],
                short_signals: [
                    { date: '2025-04-16', symbol: 'IBM', signal_score: -9.13, close: 238.57, ema_9: 238.57, ema_21: 238.57, volume: 4870268 },
                    { date: '2025-04-16', symbol: 'INTC', signal_score: -9.39, close: 19.23, ema_9: 19.23, ema_21: 19.23, volume: 89311716 },
                    { date: '2025-04-16', symbol: 'BA', signal_score: -8.64, close: 156.47, ema_9: 156.47, ema_21: 156.47, volume: 6803289 },
                    { date: '2025-04-16', symbol: 'GE', signal_score: -9.01, close: 182.45, ema_9: 182.45, ema_21: 182.45, volume: 5128031 },
                    { date: '2025-04-16', symbol: 'XOM', signal_score: -8.83, close: 104.19, ema_9: 104.19, ema_21: 104.19, volume: 13602717 }
                ]
            };
            
            displayRawResponse(mockData);
            updateStatus('Successfully generated mock signals', 'success');
            displaySignals(mockData.buy_signals, mockData.short_signals);
        }
        
        // Clear Results
        function clearResults() {
            rawResponseEl.textContent = 'No results yet.';
            buySignalsEl.innerHTML = '';
            shortSignalsEl.innerHTML = '';
            statusEl.innerHTML = '';
            statusEl.className = 'status';
            signalDisplayEl.style.display = 'none';
        }
        
        // Display Raw Response
        function displayRawResponse(data) {
            rawResponseEl.textContent = JSON.stringify(data, null, 2);
        }
        
        // Update Status
        function updateStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        // Display Signals
        function displaySignals(buySignals, shortSignals) {
            signalDisplayEl.style.display = 'block';
            
            // Display buy signals
            buySignalsEl.innerHTML = '';
            buySignals.forEach(signal => {
                const card = createSignalCard(signal, 'buy');
                buySignalsEl.appendChild(card);
            });
            
            // Display short signals
            shortSignalsEl.innerHTML = '';
            shortSignals.forEach(signal => {
                const card = createSignalCard(signal, 'short');
                shortSignalsEl.appendChild(card);
            });
        }
        
        // Create Signal Card
        function createSignalCard(signal, type) {
            const card = document.createElement('div');
            card.className = `signal-card ${type}`;
            
            card.innerHTML = `
                <div class="symbol">${signal.symbol}</div>
                <div class="score">Score: ${signal.signal_score}</div>
                <div class="details">
                    <div>Date: ${signal.date}</div>
                    <div>Close: ${signal.close}</div>
                    <div>EMA9: ${parseFloat(signal.ema_9).toFixed(2)}</div>
                    <div>EMA21: ${parseFloat(signal.ema_21).toFixed(2)}</div>
                    <div>Volume: ${signal.volume.toLocaleString()}</div>
                </div>
            `;
            
            return card;
        }
        
        // Test TV Integration
        async function testTvIntegration() {
            updateStatus('Testing TradingViewIntegration service...', '');
            
            try {
                // Create a script element to import the service
                const script = document.createElement('script');
                script.src = '/static/js/bundle.js';
                document.body.appendChild(script);
                
                script.onload = () => {
                    // Check if window.TradingViewIntegration exists
                    if (window.TradingViewIntegration) {
                        updateStatus('TradingViewIntegration service loaded', 'success');
                        
                        // Try to call getSignals
                        window.TradingViewIntegration.getSignals()
                            .then(data => {
                                displayRawResponse(data);
                                updateStatus('Successfully fetched signals from TradingViewIntegration', 'success');
                                
                                if (data.buy_signals && data.short_signals) {
                                    displaySignals(data.buy_signals, data.short_signals);
                                }
                            })
                            .catch(error => {
                                updateStatus(`Error calling getSignals: ${error.message}`, 'error');
                            });
                    } else {
                        updateStatus('TradingViewIntegration not available in window object', 'error');
                    }
                };
                
                script.onerror = () => {
                    updateStatus('Failed to load bundle.js', 'error');
                };
            } catch (error) {
                console.error('Error testing TradingViewIntegration:', error);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }
        
        // Initialize with an API test
        document.addEventListener('DOMContentLoaded', testApiConnection);
    </script>
</body>
</html>

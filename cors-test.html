<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button id="testCors">Test CORS Connection</button>
    <pre id="result"></pre>

    <script>
        document.getElementById('testCors').addEventListener('click', async () => {
            const resultElement = document.getElementById('result');
            resultElement.textContent = 'Testing CORS connection...';

            try {
                const response = await fetch('http://localhost:5001/api/cors-test', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                resultElement.textContent = 'Success! CORS is working properly.\n\n' + 
                    JSON.stringify(data, null, 2);
            } catch (error) {
                resultElement.textContent = 'Error: ' + error.message;
                console.error('CORS test failed:', error);
            }
        });
    </script>
</body>
</html>

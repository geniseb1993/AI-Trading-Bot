<!DOCTYPE html>
<html>
<head>
  <title>Generate Signals Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    #results { margin-top: 20px; padding: 10px; border: 1px solid #ddd; min-height: 200px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Generate Signals Test</h1>
  
  <div>
    <button onclick="testDualBotEndpoint()">Test Dual Bot Endpoint</button>
    <button onclick="testLegacyEndpoint()">Test Legacy Endpoint</button>
  </div>
  
  <div id="results">
    <p>Results will appear here...</p>
  </div>
  
  <script>
    async function testDualBotEndpoint() {
      const resultDiv = document.getElementById('results');
      resultDiv.innerHTML = '<p>Testing dual bot endpoint...</p>';
      
      try {
        const response = await fetch('http://localhost:5000/api/dual-bot/generate-signals', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        const data = await response.json();
        resultDiv.innerHTML += `<p>Status: ${response.status}</p>`;
        resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (error) {
        resultDiv.innerHTML += `<p>Error: ${error.message}</p>`;
      }
    }
    
    async function testLegacyEndpoint() {
      const resultDiv = document.getElementById('results');
      resultDiv.innerHTML = '<p>Testing legacy endpoint...</p>';
      
      try {
        const response = await fetch('http://localhost:5000/api/generate-signals', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        const data = await response.json();
        resultDiv.innerHTML += `<p>Status: ${response.status}</p>`;
        resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (error) {
        resultDiv.innerHTML += `<p>Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
